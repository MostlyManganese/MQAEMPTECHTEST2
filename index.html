<html>
    <title></title>
    <head>
        <!-- dis inline css, i prefer external css tho but lets just use this-->
        <style>
            @font-face {
            font-family: Inter;
                src: url(Inter_24pt-Bold.ttf);
            }
            * {
                padding: 0;
                margin: 0;
            }

            html {
                scroll-behavior: smooth;
            }

            .navbar {
                font-family: Inter;
                font-weight: bold;
                font-size: 25px;
                color: white;
                display: flex;
                height: 55px;
                width: 100%;    
                background-color: #C62828;
                justify-content: flex-end;
                align-items: center;
                position: fixed;
                z-index: 1;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            }

            .navbar-ul {
                display: flex;
                list-style: none;
                flex-wrap: wrap;
                justify-content: center;
            }

            .navbar-ul li {
                display: flex;
                padding: 5px;
                cursor: pointer;
                margin: 5px;
                align-items: center;
                padding-right: 20px;
                transition: transform 0.1s ease-in-out;
            }

            .box {
                height: 1000px;
                display: flex;
                padding-top: 5%;
                justify-content: center;
            }

            .shadow {
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.75);
            }

            #test {
                height: 80%;
                width: 65%; 
                border-radius: 50px;
                background-color: blueviolet;
                position: relative;
                bottom: -25px;
                left: -30px;
            }

            #test1 {
                height: 80%;
                width: 20%; 
                border-radius: 50px;
                background-color: rgb(46, 43, 226);
                position: relative;
                bottom: -25px;
                left: 20px;
            }

            #test2 {
                height: 55%;
                width: 87%; 
                border-radius: 50px;
                background-color: rgb(43, 168, 226);
                position: relative;
                bottom: -320px;
                left: 780px;
                flex-shrink: 0;
            }

            #test3 {
                height: 25%;
                width: 87%; 
                border-radius: 50px;
                background-color: rgb(43, 226, 195);
                position: relative;
                bottom: -5px;
                right: 850px;
                flex-shrink: 0;
            }

            #test4 {
                height: 80%;
                width: 65%; 
                border-radius: 50px;
                background-color: rgb(61, 43, 226);
                position: relative;
                bottom: 20px;
                left: -30px;
            }

            #test5 {
                height: 80%;
                width: 20%; 
                border-radius: 50px;
                background-color: rgb(195, 43, 226);
                position: relative;
                bottom: 20px;
                left: 20px;
            }

            #test6 {
                height: 80%;
                width: 65%; 
                border-radius: 50px;
                background-color: rgb(43, 137, 226);
                position: relative;
                bottom: 20px;
                left: -30px;
            }

            #test7 {
                height: 80%;
                width: 20%; 
                border-radius: 50px;
                background-color: rgb(223, 226, 43);
                position: relative;
                bottom: 20px;
                left: 20px;
            }

            a {
                text-decoration: none;
                color: inherit;
            }

        </style>
    </head>
    <body>
        <!-- navbar -->
        <nav class ="navbar">
            <ul class="navbar-ul">
                <li><a href="#Home">HOME</a></li>
                <li><a href="#Problems">PROBLEMS</a></li>
                <li><a href="#Solutions">SOLUTIONS</a></li>
                <li><a href="#Members">MEMBERS</a></li>
            </ul>
        </nav>
        
        <!-- divs -->
        <div id ="Home" class="box">
            <div id="test" class="shadow"></div>
            <div id="test1" class="shadow"></div>
        </div>
        <div id ="Problems" class="box">
            <div id="test2" class="shadow"></div>
            <div id="test3" class="shadow"></div>
        </div>
        <div id ="Solutions" class="box">
            <div id="test4" class="shadow"></div>
            <div id="test5" class="shadow"></div>
        </div>
        <div id ="Members" class="box">
            <div id="test6" class="shadow"></div>
            <div id="test7" class="shadow"></div>
        </div>
    </body>
</html>
